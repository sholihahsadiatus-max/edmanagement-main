<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin ED Management</title>

  <link rel="stylesheet" href="style.css">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

  <!-- HALAMAN LOGIN ADMIN -->
  <section id="loginPage" class="login-page">
    <div class="login-card">
      <div class="login-logo">ED</div>
      <h1>ED Management</h1>
      <p>Masuk ke panel administrator</p>

      <form id="loginForm">
        <label for="adminEmail">Email Admin</label>
        <input
          type="email"
          id="adminEmail"
          placeholder="Masukkan email admin"
          autocomplete="username"
          required
        >

        <label for="adminPassword">Password</label>
        <input
          type="password"
          id="adminPassword"
          placeholder="Masukkan password"
          autocomplete="current-password"
          required
        >

        <button type="submit" id="loginBtn">Masuk</button>
        <p id="loginMessage" role="alert"></p>
      </form>
    </div>
  </section>

  <!-- DASHBOARD ADMIN -->
  <div class="app" id="adminApp" hidden>

    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brand-icon">ED</div>
        <div>
          <h2>ED Management</h2>
          <p>Admin Panel</p>
        </div>
      </div>

      <div class="menu-label">MENU UTAMA</div>

      <nav class="navigation">
        <button class="nav-item active" data-page="dashboard">
          <span class="nav-icon">▦</span> Dashboard
        </button>

        <button class="nav-item" data-page="approvals">
          <span class="nav-icon">✓</span> Persetujuan Penjual
          <span class="nav-badge" id="approvalBadge">0</span>
        </button>

        <button class="nav-item" data-page="buyers">
          <span class="nav-icon">♙</span> Data Pembeli
        </button>

        <button class="nav-item" data-page="sellers">
          <span class="nav-icon">♧</span> Data Penjual
        </button>

        <button class="nav-item" data-page="products">
          <span class="nav-icon">▣</span> Data Produk
        </button>

        <button class="nav-item" data-page="orders">
          <span class="nav-icon">▤</span> Data Pesanan
        </button>

        <button class="nav-item" data-page="reports">
          <span class="nav-icon">▥</span> Laporan Penjualan
        </button>
      </nav>

      <div class="sidebar-bottom">
        <div class="admin-profile">
          <div class="avatar">A</div>
          <div class="profile-info">
            <strong id="adminName">Administrator</strong>
            <span id="adminEmailLabel">Admin ED Management</span>
          </div>
        </div>

        <button class="logout-btn" id="logoutBtn">↪ Keluar</button>
      </div>
    </aside>

    <main class="main-content">
      <header class="topbar">
        <button class="mobile-menu" id="mobileMenu" aria-label="Buka menu">☰</button>

        <div class="breadcrumb">
          ED Management / <strong id="breadcrumbTitle">Dashboard</strong>
        </div>

        <div class="topbar-right">
          <span class="status-dot"></span>
          <span class="admin-label">Panel Admin</span>
        </div>
      </header>

      <div class="content">
        <section class="page-heading">
          <div>
            <p class="eyebrow">ADMINISTRATOR</p>
            <h1 id="pageTitle">Dashboard</h1>
            <p id="pageDescription">Pantau aktivitas marketplace ED Management.</p>
          </div>

          <div class="date-label" id="currentDate"></div>
        </section>

        <div id="pageContent"></div>

        <footer>
          © 2026 ED Management · Admin Marketplace UMKM
        </footer>
      </div>
    </main>
  </div>

  <div class="toast" id="toast" role="status"></div>

  <!-- Supabase JS -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="script.js"></script>

</body>
</html>
